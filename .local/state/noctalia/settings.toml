config_version = 16

[audio]
enable_notification_sounds = false

[bar.default]
center = [ "control-center", "clock", "screenshot" ]
end = [
    "nightlight",
    "keyboard_layout",
    "battery",
    "volume",
    "network",
    "bluetooth",
    "notifications",
    "clipboard",
    "tray",
    "session"
]
font_scale = 0.89999998733401299
margin_ends = 0
padding = 10
radius = 0
scale = 1.2000000104308128
shadow = false
start = [ "launcher", "workspaces", "active_window" ]
thickness = 21
widget_spacing = 11

[bluetooth]
connection_notifications = true

[brightness]
minimum_brightness = 0.0099999997764825821

[calendar]
enabled = true
event_date_format = "%a %e %B"
refresh_minutes = 5

    [calendar.account.jluttine]
    name = "GMail"
    type = "google"

[control_center.calendar]
show_events_location = true
show_week_numbers = true

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 10

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    locked_timeout = 30.0
    timeout = 300.0

[keybinds]
down = [ "Down", "Ctrl+j" ]
left = [ "Left", "Ctrl+h" ]
right = [ "Right", "Ctrl+l" ]
up = [ "Up", "Ctrl+k" ]

[location]
address = "Tampere, Finland"

[lockscreen]
fingerprint = false
grace_period_seconds = 2
transition = [ "fade" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 984.5001220703125
    cy = 1006.1400756835938
    output = "eDP-1"
    placement_height = 1230.0
    placement_width = 1969.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_day = 5000
temperature_night = 3500

[notification]
filter_order = [ "filter" ]

    [notification.filter.filter]
    allow_permanent = true
    bypass_dnd = false
    enabled = true
    match = "networkmanager applet"
    match_content = ".*"
    play_sound = true
    save_history = false
    show_toast = true

[osd.kinds]
keyboard_layout = false

[shell]
clipboard_history_max_entries = 10
launch_apps_as_systemd_services = true

    [shell.launcher]
    search_position = "top"

    [shell.panel]
    clipboard_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    annotate = true
    confirm_region = true
    directory = "/home/jluttine/Desktop/Screenshots"
    remember_last_region = true
    skip_annotate_on_copy_save = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    label = "Suspend"
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "o"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "r"
    variant = "destructive"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 5.0
    enabled = true
    label = "Power Off"
    shortcut = "p"
    variant = "destructive"

[theme]
builtin = "Ayu"
community_palette = "Solarized"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "emacs", "gtk3", "gtk4", "qt", "umbriel" ]
    community_ids = [ "chromium-based", "pywalfox", "neovim", "thunderbird" ]

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/nix/store/3qbfjgnm132ffi129bvmi47y505sqj1w-noctalia-5.0.1/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/nix/store/3qbfjgnm132ffi129bvmi47y505sqj1w-noctalia-5.0.1/share/noctalia/assets/noctalia-wallpaper.png"

[widget.active_window]
capsule = true
capsule_padding = 10
font_scale = 0.90000000000000013
max_length = 500
show_empty_label = true

[widget.battery]
display_mode = "graphic"

[widget.brightness]
enabled = false

[widget.clock]
anchor = true
format = "{:%H:%M, %a %b %e}"

[widget.media]
enabled = false

[widget.network]
scale = 1.3
show_label = false
vpn_status = "both"

    [widget.network.actions]
    right = "exec nm-connection-editor"

[widget.nightlight.actions]
left = "nightlight-toggle"

[widget.tray]
hidden = [ "nm-applet" ]
hide_passive = false
match_adjacent_spacing = true

[widget.volume]
mute_color = "on_error_container"
show_label = false

[widget.workspaces]
hide_when_empty = true