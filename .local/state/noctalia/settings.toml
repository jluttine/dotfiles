config_version = 16

[audio]
enable_notification_sounds = false

[bar.default]
end = [
    "keyboard_layout",
    "battery",
    "volume",
    "media",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "brightness",
    "control-center",
    "tray",
    "session"
]
font_scale = 1.0499999839812517
margin_ends = 0
radius = 0
scale = 1.0500000081956387
shadow = false
start = [ "launcher", "workspaces" ]
thickness = 30
widget_spacing = 9

[bluetooth]
connection_notifications = true

[brightness]
minimum_brightness = 0.0099999997764825821

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 10

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    locked_timeout = 30.0
    timeout = 300.0

[location]
address = "Tampere, Finland"

[lockscreen]
fingerprint = false
grace_period_seconds = 2
transition = [ "fade" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1163.5
    cy = 1189.3720703125
    output = "eDP-1"
    placement_height = 1454.0
    placement_width = 2327.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[osd.kinds]
keyboard_layout = false

[shell]
clipboard_history_max_entries = 10
launch_apps_as_systemd_services = true

    [shell.panel]
    session_placement = "floating"
    session_position = "center"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    label = "Suspend"
    shortcut = "s"
    variant = "primary"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "o"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "r"
    variant = "destructive"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 5.0
    enabled = true
    label = "Power Off"
    shortcut = "p"
    variant = "destructive"

[theme]
builtin = "Nord"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/nix/store/3qbfjgnm132ffi129bvmi47y505sqj1w-noctalia-5.0.1/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/nix/store/3qbfjgnm132ffi129bvmi47y505sqj1w-noctalia-5.0.1/share/noctalia/assets/noctalia-wallpaper.png"

[widget.battery]
display_mode = "graphic"

[widget.brightness]
enabled = false

[widget.clock]
format = "{:%H:%M, %a %b %e}"

[widget.control-center]
enabled = false

[widget.media]
enabled = false

[widget.volume]
mute_color = "on_error_container"
show_label = false

[widget.workspaces]
hide_when_empty = true